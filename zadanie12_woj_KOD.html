<body>
  <textarea cols="90" rows="24">
&lt;!DOCTYPE html&gt;
&lt;html lang="pl"&gt;
&lt;head&gt;
  &lt;meta charset="utf-8"&gt;
  &lt;title&gt;Wojciechowski - zadanie 12&lt;/title&gt;
&lt;/head&gt;
&lt;body&gt;
  &lt;div style="color:green;font-size:36px;"&gt;
    &lt;script language="JavaScript"&gt;
      // Kacper Wojciechowski 3F 09.10.2026
      // Zadanie 12
      var D1_woj=prompt("Dzień1 (D1)=","");
      var G1_woj=prompt("Godzina1 (G1)=","");
      var D2_woj=prompt("Dzień2 (D2)=","");
      var G2_woj=prompt("Godzina2 (G2)=","");
      var sekund;
      var d1=parseFloat(D1_woj);
      var g1=parseFloat(G1_woj);
      var d2=parseFloat(D2_woj);
      var g2=parseFloat(G2_woj);
      sekund=((d1-d2)*24+(g1-g2))*60*60;
      document.write("Ilość sekund między "+d1+" dniem godz. "+g1+" a "+d2+" dniem godz. "+g2+" = "+sekund+"&lt;br&gt;");
      function okno_zamknij_wojciechowski()
      {
        window.close()
      }
    &lt;/script&gt;
  &lt;/div&gt;
  &lt;input type="button" value="zamknij okno" onclick="okno_zamknij_wojciechowski()"/&gt;
&lt;/body&gt;
&lt;/html&gt;

  </textarea>

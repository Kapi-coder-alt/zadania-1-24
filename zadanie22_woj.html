<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<title>Wojciechowski 3F - zadanie 22</title>
<script type="text/javascript">
// Kacper Wojciechowski 3F nr 27 - zadanie 22
function Pole_wojciechowski(a_woj, b_woj)
{
  return a_woj*b_woj;
}
function obwod_wojciechowski(a_woj, b_woj)
{
  return 2*a_woj + 2*b_woj;
}
function oblicz_woj()
{
  var a_woj = parseFloat(document.getElementsByName('a_dana_woj')[0].value);
  var b_woj = parseFloat(document.getElementsByName('b_dana_woj')[0].value);
  var p = Pole_wojciechowski(a_woj, b_woj);
  var o = obwod_wojciechowski(a_woj, b_woj);
  document.getElementById('wyprowadz_pole_woj').innerHTML = "Pole = " + p.toFixed(2) + " cm^2";
  document.getElementById('wyprowadz_obwod_woj').innerHTML = "Obwód = " + o.toFixed(2) + " cm";
  document.getElementsByName('pole')[0].value = p.toFixed(2);
  document.getElementsByName('obw')[0].value = o.toFixed(2);
}
function okno_zamknij_wojciechowski()
{
  window.close()
}
</script>
</head>
<body>
<h2>Pole i obwód prostokąta</h2>
Podaj a= <input type="text" name="a_dana_woj" size="6" value="3">
Podaj b= <input type="text" name="b_dana_woj" size="6" value="4">
<br><br>
<input type="button" value="oblicz" onclick="oblicz_woj()">
<br><br>
Pole= <input type="text" name="pole" size="8">
Obwód= <input type="text" name="obw" size="8">
<br><br>
<table>
  <tr><td id="wyprowadz_pole_woj"></td></tr>
  <tr><td id="wyprowadz_obwod_woj"></td></tr>
</table>
<br>
<input type="button" value="zamknij okno" onclick="okno_zamknij_wojciechowski()">
</body>
</html>

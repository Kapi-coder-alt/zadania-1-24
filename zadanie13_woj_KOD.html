    &lt;script language="JavaScript"&gt;
      // Kacper Wojciechowski 3F 09.10.2026
      // Zadanie 13
      var m_woj=prompt("m=","");
      var m=parseFloat(m_woj);
      var p=m+1;
      var q=m*(m+1);
      document.write("Rozkład ułamka egipskiego na dwa ułamki egipskie&lt;br&gt;");
      document.write("1/m = 1/(m+1) + 1/(m*(m+1))&lt;br&gt;");
      document.write("1/"+m+" = 1/"+p+" + 1/"+q+"&lt;br&gt;");
      function okno_zamknij_wojciechowski()
      {
        window.close()
      }
    &lt;/script&gt;
  &lt;/div&gt;
  &lt;input type="button" value="zamknij okno" onclick="okno_zamknij_wojciechowski()"/&gt;

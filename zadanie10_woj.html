  <div style="color:red;font-size:50px;">
    <script language="JavaScript">
      // Kacper Wojciechowski 3F 09.10.2026

      var liczba1=prompt("liczba1=","");
      var liczba2=prompt("liczba2=","");
      var suma;
      var a=parseFloat(liczba1);
      var b=parseFloat(liczba2);
      suma=a+b;
      document.write("suma="+a+" + "+b+" = "+suma+"<br>");
      function okno_zamknij_wojciechowski()
      {
        window.close()
      }

  </div>
  <input type="button" value="zamknij okno" onclick="okno_zamknij_wojciechowski()"/>

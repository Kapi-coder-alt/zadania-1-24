<body>
  <div style="color:black;font-size:30px;">
    <script language="JavaScript">
      // Kacper Wojciechowski 3F 09.10.2026
      // Zadanie 15
      var m_woj=prompt("m=","");
      var m=parseFloat(m_woj);
      var d=2*m;
      document.write("Rozkład ułamka egipskiego na dwa takie same ułamki egipskie<br>");
      document.write("1/m = 1/(2*m) + 1/(2*m)<br>");
      document.write("1/"+m+" = 1/"+d+" + 1/"+d+"<br>");
      function okno_zamknij_wojciechowski()
      {
        window.close()
      }
    </script>
  </div>
  <input type="button" value="zamknij okno" onclick="okno_zamknij_wojciechowski()"/>
</body>
